name: Test Notifikasi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Jalankan test
        env:
          ETHOL_COOKIE: ${{ secrets.ETHOL_COOKIE }}
          ETHOL_TOKEN:  ${{ secrets.ETHOL_TOKEN }}
          GIST_TOKEN:   ${{ secrets.GIST_TOKEN }}
        run: python test_notif.py