name: Cek Notifikasi PENS → Discord

on:
  workflow_dispatch:   # Hanya trigger dari luar (cron-job.org)

jobs:
  kirim-notifikasi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore cache sent_ids
        uses: actions/cache@v4
        with:
          path: sent_ids.json
          key: sent-ids-${{ github.run_id }}
          restore-keys: |
            sent-ids-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install requests

      - name: Jalankan script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ETHOL_COOKIE:        ${{ secrets.ETHOL_COOKIE }}
          ETHOL_TOKEN:         ${{ secrets.ETHOL_TOKEN }}
          GIST_ID:             ${{ secrets.GIST_ID }}
          GIST_TOKEN:          ${{ secrets.GIST_TOKEN }}
        run: python notif_to_discord.py
