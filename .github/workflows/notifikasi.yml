name: Cek Notifikasi PENS → Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kirim-notifikasi:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Perlu untuk push file .ics ke repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore cache sent_ids
        uses: actions/cache@v4
        with:
          path: sent_ids.json
          key: sent-ids-${{ github.run_id }}
          restore-keys: |
            sent-ids-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install requests

      - name: Jalankan script
        env:
          ETHOL_COOKIE: ${{ secrets.ETHOL_COOKIE }}
          ETHOL_TOKEN:  ${{ secrets.ETHOL_TOKEN }}
        run: python notif_to_discord.py

      - name: Commit & push file kalender (.ics)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/deadline.ics
          git diff --cached --quiet || git commit -m "chore: update deadline.ics [skip ci]"
          git push
